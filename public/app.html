<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porch Pile: your whole influencer operation in one place</title>
<meta name="description" content="Turn the porch pile into posted videos and paid brand deals. Every product, every video, every brand deal, every dollar.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Bricolage Grotesque';font-weight:600 800;font-display:swap;src:url('/fonts/bricolage-latin.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:400 800;font-display:swap;src:url('/fonts/figtree-latin.woff2') format('woff2')}

:root{--on-second:#2A1A00;--font-head:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;--font-body:'Figtree','Avenir Next',system-ui,sans-serif;
  --bg:#F2F6F1;--paper:#FFFFFF;--ink:#1D2A22;--muted:#526357;--muted2:#526357;
  --indigo:#C2255C;--indigo-dk:#A01D4B;--amber:#F2A93B;--amber-dk:#D68A1E;--amber-tx:#8F5A00;
  --kraft:#C9A87C;--kraft-dk:#8A6F4E;--leaf:#2F7D45;--berry:#B42318;
  --line:rgba(29,42,34,.13);--card-bd:rgba(255,255,255,.85);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Figtree','Avenir Next',system-ui,sans-serif;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
.mesh{position:fixed;inset:0;z-index:-2;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);mix-blend-mode:multiply;opacity:.4;animation:drift 18s ease-in-out infinite alternate}
.b1{width:min(520px,80vw);height:min(520px,80vw);background:#F9CFDD;top:-160px;left:-120px}
.b2{width:min(460px,70vw);height:min(460px,70vw);background:#FBE3B8;top:30%;right:-140px;animation-duration:23s;animation-direction:alternate-reverse}
.b3{width:min(420px,66vw);height:min(420px,66vw);background:#D6EBD4;bottom:-140px;left:10%;animation-duration:15s}
@keyframes drift{to{transform:translate(40px,-30px) scale(1.12)}}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-weight:600}
a{color:var(--indigo)}
.wrap{max-width:460px;margin:0 auto;padding:40px 20px 60px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:6px;text-decoration:none}
/* Same lockup as the landing page and the rest of the fleet: ink word, indigo
   pop word, amber swoop underneath. Swoop geometry is in em so it tracks the
   h1 whether it renders at 2rem (auth screens) or 1.5rem (app header). */
.brand h1{font-size:2rem;margin:0;color:var(--ink);line-height:1}
.brand h1 .pop{color:var(--indigo);position:relative;display:inline-block}
.brand h1 .pop svg{position:absolute;left:0;right:0;bottom:-.17em;width:100%;height:.15em;overflow:visible}
.tag{text-align:center;color:var(--muted2);font-weight:600;margin:0 0 26px;font-size:.98rem}
.card{background:var(--paper);border:1px solid var(--card-bd);border-radius:20px;padding:26px 24px;box-shadow:0 10px 30px rgba(194,37,92,.12)}
.card h2{font-size:1.25rem;margin:0 0 4px}
.sub{color:var(--muted2);font-weight:600;font-size:.88rem;margin:0 0 18px}
label{display:block;font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);margin:14px 0 5px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-family:'Figtree','Avenir Next',system-ui,sans-serif;font-size:1rem;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(194,37,92,.15)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;color:var(--muted2)}
.btn{width:100%;margin-top:20px;padding:13px;border:none;border-radius:12px;font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-size:1rem;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--indigo),var(--indigo-dk));box-shadow:0 4px 14px rgba(194,37,92,.3);position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.16),transparent);pointer-events:none;border-radius:inherit}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-ghost{background:none;color:var(--muted2);box-shadow:none;font-size:.85rem;margin-top:12px;padding:6px}
.btn-ghost::before{display:none}
.switch{text-align:center;margin-top:16px;font-size:.86rem;color:var(--muted2);font-weight:600}
.switch a{cursor:pointer;font-weight:700}
.msg{margin-top:14px;padding:11px 13px;border-radius:11px;font-size:.85rem;font-weight:600;display:none}
.msg.err{background:rgba(180,35,24,.13);color:#B42318;display:block}
.msg.ok{background:rgba(47,125,69,.15);color:#2F7D45;display:block}
.consent{font-size:.74rem;color:var(--muted2);font-weight:600;margin-top:14px;line-height:1.45}
.foot{text-align:center;margin-top:26px;font-size:.72rem;color:var(--muted2);font-weight:600}
.foot a{color:var(--muted2);margin:0 6px}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--indigo);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------------- app shell ---------------- */
/* Base cap is the phone/small-tablet value. The 900/1180/1560 ladder lives in
   the responsive block at the bottom of this stylesheet — see "responsive
   shell". A flat 940 used 49% of a 1920 screen. */
.appwrap{max-width:900px;margin:0 auto;padding:24px 18px 110px} /* room for the FAB */
.apphead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.apphead .brand{margin:0;justify-content:flex-start}
.apphead .brand h1{font-size:1.5rem}
.pill{display:inline-block;background:rgba(47,125,69,.15);color:#2F7D45;font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-size:.72rem;padding:4px 11px;border-radius:999px}
.hdrright{display:flex;align-items:center;gap:9px}
.gopro{border:none;border-radius:999px;padding:9px 16px;min-height:36px;font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--amber),var(--amber-dk));box-shadow:0 4px 12px rgba(242,169,59,.4);position:relative;overflow:hidden}
.gopro::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent);pointer-events:none;border-radius:inherit}
.gopro:hover{transform:translateY(-1px)}
.app{display:grid;grid-template-columns:270px 1fr;gap:20px 28px;align-items:start}
.app>.appmain{min-width:0}

/* character panel */
.charpanel{position:sticky;top:20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.speech{background:var(--paper);border:1px solid var(--card-bd);border-radius:18px;padding:14px 16px;font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-weight:500;font-size:.92rem;text-align:center;line-height:1.45;min-height:58px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 6px 18px rgba(194,37,92,.10);width:100%}
.speech::after{content:'';position:absolute;bottom:-9px;left:50%;margin-left:-9px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:9px solid var(--paper)}
.bandit-wrap{position:relative;width:170px;height:185px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center}
.bandit-wrap::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;height:210px;background:radial-gradient(ellipse,rgba(242,169,59,.30),transparent 70%);border-radius:50%;animation:glow 4s ease-in-out infinite;z-index:0}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
.bandit{position:relative;width:160px;height:175px;z-index:1}
.state-idle{animation:sway 3.4s ease-in-out infinite}
.state-pleased{animation:bounce .5s ease-in-out 2}
.state-celebrating{animation:celebrate .35s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px) scale(1.04)}}
@keyframes celebrate{0%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-14px) rotate(5deg)}100%{transform:translateY(0) rotate(-5deg)}}
/* Bandit: the SVG comes from bandit-fort.js. The .bd-* rules below drew the old CSS Bandit and are unused. */
.bd-tail{position:absolute;right:-12px;bottom:34px;width:26px;height:88px;border-radius:14px 14px 40% 40%;transform:rotate(14deg);transform-origin:bottom center;z-index:1;
  background:repeating-linear-gradient(180deg,#818AA0 0 14px,#454C63 14px 28px);
  box-shadow:inset -3px 0 6px rgba(29,42,34,.35);animation:tailsway 3s ease-in-out infinite}
@keyframes tailsway{0%,100%{transform:rotate(10deg)}50%{transform:rotate(20deg)}}
.bd-head{position:absolute;left:50%;margin-left:-52px;top:0;width:104px;height:88px;z-index:3;
  border-radius:50% 50% 46% 46%/58% 58% 42% 42%;
  background:radial-gradient(circle at 34% 28%,#B7BDCC 0%,#8C94A8 48%,#5F6680 100%);
  box-shadow:0 8px 18px rgba(29,42,34,.30),inset 0 -8px 14px rgba(29,42,34,.28),inset 0 5px 10px rgba(255,255,255,.16)}
.bd-ear{position:absolute;top:-12px;width:30px;height:30px;border-radius:60% 60% 20% 60%;background:radial-gradient(circle at 40% 40%,#8C94A8,#4C536B);z-index:2;box-shadow:inset 0 -3px 6px rgba(29,42,34,.4)}
.bd-ear.l{left:2px;transform:rotate(-18deg)}
.bd-ear.r{right:2px;transform:rotate(108deg)}
.bd-face{position:absolute;left:50%;margin-left:-52px;top:0;width:104px;height:88px;z-index:4}
.bd-paw{position:absolute;top:74px;width:26px;height:16px;border-radius:10px 10px 6px 6px;background:radial-gradient(circle at 40% 30%,#A6ADBF,#6E7688);z-index:5;box-shadow:0 2px 4px rgba(29,42,34,.3)}
.bd-paw.l{left:26px}.bd-paw.r{right:26px}
.bd-box{position:absolute;left:50%;margin-left:-65px;bottom:0;width:130px;height:96px;z-index:4;border-radius:8px 8px 12px 12px;
  background:linear-gradient(180deg,#CDAC80 0%,#C9A87C 40%,#A8845C 100%);
  box-shadow:0 10px 22px rgba(138,111,78,.35),inset 0 4px 8px rgba(255,255,255,.25),inset 0 -8px 14px rgba(90,66,40,.25)}
.bd-box::before{content:'';position:absolute;top:0;left:50%;margin-left:-13px;width:26px;height:100%;background:linear-gradient(180deg,#E8D9BE,#D9C49C);opacity:.85}
.bd-box::after{content:'';position:absolute;top:16px;left:12px;width:40px;height:26px;background:#FFFFFF;border-radius:3px;box-shadow:0 1px 3px rgba(90,66,40,.3);opacity:.95}
.bd-flap{position:absolute;top:-10px;width:56px;height:14px;background:linear-gradient(180deg,#B08D62,#9A7850);z-index:3;border-radius:3px}
.bd-flap.l{left:50%;margin-left:-64px;transform:rotate(-8deg)}
.bd-flap.r{left:50%;margin-left:8px;transform:rotate(8deg)}
.charstat{width:100%;background:var(--paper);border:1px solid var(--card-bd);border-radius:16px;padding:12px 14px;box-shadow:0 6px 18px rgba(194,37,92,.10)}
.bar{height:9px;border-radius:999px;background:rgba(29,42,34,.10);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--amber),var(--indigo));transition:width .5s cubic-bezier(.34,1.56,.64,1)}
.charstat .lbl{font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2)}
.charstat .val{font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-size:1.05rem}

/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;background:none;border:1.5px solid transparent;border-radius:999px;padding:8px 15px;font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-size:.86rem;color:var(--muted2);cursor:pointer}
.tab.on{background:var(--paper);border-color:var(--card-bd);color:var(--ink);box-shadow:0 4px 12px rgba(194,37,92,.10)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--paper);border:1px solid var(--card-bd);border-radius:16px;padding:14px 16px;box-shadow:0 6px 18px rgba(194,37,92,.10)}
.tile .lbl{font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2)}
.tile .num{font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-size:1.7rem;line-height:1.2;background:linear-gradient(135deg,var(--indigo),var(--amber-dk));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tile .note{font-size:.76rem;color:var(--muted2);font-weight:600}
.empty{color:var(--muted2);font-size:.78rem;font-weight:600;text-align:center;padding:14px 4px}

/* list rows */
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .t{flex:1;font-weight:700;font-size:.9rem;word-break:break-word}
.row .s{font-size:.72rem;color:var(--muted2);font-weight:700;font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif}
.acct-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.acct-row .btn{width:auto;margin:0;padding:10px 16px;font-size:.85rem}
.btn-sec{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn-sec::before{display:none}
/* Quieter Pro buttons on Settings: still a full button, but outlined so
   "Save settings" stays the only filled primary there. #A01D4B on white is 7.4:1. */
.btn-quiet{background:var(--paper);color:var(--indigo-dk);border:2px solid var(--indigo);box-shadow:none}
.btn-quiet::before{display:none}
.btn-quiet:hover{background:rgba(194,37,92,.06)}
/* Settings: Advanced fold (timezone + spreadsheet import), closed by default */
details.advset{margin-top:16px}
details.advset>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-weight:600;font-size:.95rem;color:var(--ink);padding:14px 18px;background:var(--paper);border:1px solid var(--line);border-radius:16px;min-height:44px}
details.advset>summary::-webkit-details-marker{display:none}
details.advset>summary::before{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s ease}
details.advset[open]>summary::before{transform:rotate(45deg)}
details.advset>summary .adv-hint{font-family:'Figtree','Avenir Next',system-ui,sans-serif;font-weight:600;font-size:.78rem;color:var(--muted2);margin-left:auto}
details.advset>summary:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.danger{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);text-align:center}
.danger a{color:var(--muted2);font-size:.8rem;cursor:pointer;text-decoration:underline}
/* guided tour */
#tourring{border:3px solid var(--amber);border-radius:14px;box-shadow:0 0 0 6px rgba(242,169,59,.25);pointer-events:none;z-index:280;transition:all .25s ease}
#tourbox{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:min(440px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--card-bd);border-radius:16px;padding:14px 16px;box-shadow:0 14px 40px rgba(29,42,34,.3);z-index:290}
#tourbox p{font-size:.88rem;line-height:1.45;margin:0 0 10px}
.tourrow{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.tourrow .btn{width:auto;min-width:96px;margin:0}
.tourcount{margin-right:auto;font-size:.75rem;color:var(--muted2);font-weight:700}
/* help panel + header ? button */
.helpbtn{width:32px;height:32px;border-radius:999px;border:1.5px solid var(--line);background:none;color:var(--muted2);font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-size:1rem;font-weight:600;cursor:pointer}
.helpbtn:hover{color:var(--ink);border-color:var(--ink)}
.help h3{margin:18px 0 6px}
.help p,.help li{font-size:.88rem;line-height:1.5}
.help ol,.help ul{padding-left:20px;margin:6px 0}
.help li{margin:4px 0}
.help .chip{vertical-align:1px}
.helprow{display:flex;gap:8px;align-items:baseline;margin:6px 0}
.helprow .chip{flex-shrink:0}
/* import wizard */
.imp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin:8px 0}
.imp-row .imp-h{min-width:0}
.imp-row .imp-h b{display:block;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-row .imp-h span{font-size:.72rem;color:var(--muted2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-row select{width:100%;margin:0}
.imp-implied{grid-column:2;font-size:.7rem;color:var(--muted2);margin-top:-6px}
.imp-prev{overflow-x:auto;margin:10px 0}
.imp-prev table{border-collapse:collapse;width:100%;font-size:.78rem}
.imp-prev th,.imp-prev td{padding:4px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.imp-choice{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.imp-foot{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* celebrations + badges */
.celeb-overlay{position:fixed;inset:0;background:rgba(29,42,34,.42);backdrop-filter:blur(3px);z-index:450;display:flex;align-items:center;justify-content:center;padding:20px}
.celeb-box{background:var(--paper);border:1px solid var(--card-bd);border-radius:22px;padding:26px 22px;width:100%;max-width:380px;text-align:center;box-shadow:0 24px 70px rgba(29,42,34,.4);animation:panelIn .35s cubic-bezier(.34,1.56,.64,1)}
.celeb-creature{display:inline-block;animation:celebBounce 1s ease-in-out infinite}
@keyframes celebBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.celeb-kicker{font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--amber-tx);margin-top:8px}
.celeb-title{font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-weight:600;font-size:1.35rem;margin:2px 0 6px;background:linear-gradient(135deg,var(--indigo),var(--amber-dk));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.celeb-msg{font-size:.88rem;font-weight:600;color:var(--muted2);line-height:1.5}
.tip-card{background:rgba(194,37,92,.07);border-radius:14px;padding:12px 14px;margin-top:14px;text-align:left}
.tip-card .tip-text{font-size:.8rem;font-weight:700}
.tip-card .tip-cta{display:inline-block;margin-top:6px;font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-size:.8rem;color:var(--indigo);cursor:pointer;text-decoration:underline}
.tip-card .tip-disc{font-size:.66rem;color:var(--ink);font-weight:700;margin-top:3px}
/* Promo card sits under a tab's real content, quieter than the Today tip. */
.promo-card{margin-top:20px;background:rgba(194,37,92,.05);opacity:.92}
.tool-h{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);margin:14px 0 6px}
.tool-row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(194,37,92,.10)}
.tool-row:last-child{border-bottom:0}
.tool-row a{font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-size:.85rem;color:var(--indigo)}
.tool-note{font-size:.66rem;color:var(--muted2);font-weight:700}
.celeb-close{margin-top:16px;width:100%;padding:12px;border:none;border-radius:12px;font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--indigo),var(--indigo-dk))}
.flash{position:fixed;inset:0;z-index:440;pointer-events:none;animation:flashOut .5s ease-out forwards}
@keyframes flashOut{from{opacity:.5}to{opacity:0}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:10px;margin-top:12px}
.badge{background:rgba(255,255,255,.6);border:1px solid var(--card-bd);border-radius:14px;padding:10px 6px;text-align:center}
.badge .bi{height:36px;display:flex;align-items:center;justify-content:center}
.badge .bn{font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;font-size:.68rem;line-height:1.25;margin-top:5px}

@media (max-width:760px){
  .kanban{grid-template-columns:1fr;overflow-x:visible}
  .overlay{align-items:flex-end;padding:0}
  .panelbox{border-radius:20px 20px 0 0;max-width:none;max-height:min(92vh,92dvh)}

  .fab{right:16px;bottom:16px}
}
@media (max-width:760px){
  /* minmax(0,1fr), not 1fr — a bare 1fr track takes an AUTO minimum and
     inherits the min-content width of its widest child, which scrolls the whole
     page sideways at 320. */
  .app{grid-template-columns:minmax(0,1fr)}
  .charpanel{position:static}
  .bandit-wrap{order:1;transform:scale(.85)}
  .speech{order:2}
  .charstat{order:3}
  .speech::after{top:-9px;bottom:auto;border-top:none;border-bottom:9px solid var(--paper)}
}

/* ---------------- responsive shell ---------------- */
/* Fleet pattern (jen-web-design): 900 / 1180 / 1560. Every rule sits at 761px
   and up on purpose. The mobile block above is max-width:760px, and an
   unscoped rule down here beats it on source order at equal specificity — that
   stacked the phone into two squeezed columns and tripled the page height.
   The phone layout must stay byte-identical. */
@media (min-width:761px){
  .app{grid-template-columns:clamp(220px,26%,300px) minmax(0,1fr)}
  /* The pile was a single vertical flex stack, so a wider shell only made each
     card enormous with the name marooned from its status button. auto-fit
     splits into columns ONLY when each one clears 380px, which is the width
     where the brand + channel meta line stops wrapping. */
  .icards{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:10px;align-items:start}
}
@media (min-width:1024px){ .appwrap{max-width:1180px} }
@media (min-width:1440px){ .appwrap{max-width:1560px} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
.tool-row{flex-direction:column;align-items:flex-start;gap:2px}.tool-what{font-size:.82rem;color:var(--ink);line-height:1.45}.tool-chips{display:flex;flex-wrap:wrap;gap:6px}.tool-chip{font-size:.78rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--indigo-dk);text-decoration:none;background:var(--paper)}.tool-chip:hover{border-color:var(--indigo)}

/* porch swing: fleet type + contrast fixes */
h1,h2,h3,.disp{font-weight:700;letter-spacing:-.01em}button,input,select,textarea{font-family:inherit}
.demolabel,.cta.amber,.adv,.ladder .rung.lit,.loopstep.gold,.rk.next,.gopro,.vadv.post{color:var(--on-second)!important}.adv.done{color:#fff!important}
.pill,.st-posted{color:#25643A}.tip-card .tip-cta{color:var(--indigo-dk)}
.bandit-wrap::before{background:radial-gradient(ellipse,rgba(194,37,92,.16),transparent 70%)!important}
</style>

<script>
const API = '';
const app = {
  async call(path, opts = {}) {
    // Offline/network failure degrades through the normal error path (status 0)
    // instead of an unhandled rejection that silently no-ops the action.
    let r;
    try {
      r = await fetch(API + path, {
        method: opts.method || 'GET',
        headers: opts.body ? { 'Content-Type': 'application/json' } : {},
        credentials: 'include',
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
    } catch {
      return { ok: false, status: 0, data: { error: "Can't reach Porch Pile. Check your connection and try again." } };
    }
    let data = {};
    try { data = await r.json(); } catch {}
    // A 401 on an authed call means the session is gone: expired, revoked by a
    // password reset, or the account was deleted. Never leave a stale app view
    // or an open panel up. Auth endpoints return 401 for a wrong password and
    // are not a session ending.
    if (r.status === 401 && !path.startsWith('/api/auth/')) sessionEnded();
    return { ok: r.ok, status: r.status, data };
  },
};
const SESSION_ENDED_MSG = 'Your session ended. Log in again.';
function sessionEnded() {
  if (!authed) return; // already on login; several calls can 401 at once
  if (typeof endTour === 'function') endTour(true);
  clearSessionState();
  const o = document.getElementById('overlay');
  if (o) o.remove();
  const c = document.getElementById('celeb');
  if (c) c.remove();
  // The app view is stale, so replace (never push): Back must not return to it.
  go({ view: 'login' }, { replace: true, url: '/app' });
  msg('err', SESSION_ENDED_MSG);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const coonSVG = () => document.getElementById('tpl-coon').innerHTML;
const root = document.getElementById('root');
function render(html, cls = 'wrap') { root.className = cls; root.innerHTML = html; draftRestore(); }
// Typed-text drafts: survive Back/reload in this tab only (sessionStorage). Never passwords.
const DRAFT_IDS = ['li-email', 'qa-brand', 'qa-note', 'set-pace', 'set-tz'];
function draftSave(id, v) { try { sessionStorage.setItem('pp_draft_' + id, v); } catch (e) {} }
function draftClear(...ids) { try { (ids.length ? ids : DRAFT_IDS).forEach(id => sessionStorage.removeItem('pp_draft_' + id)); } catch (e) {} }
function draftRestore() {
  DRAFT_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    let d = null;
    try { d = sessionStorage.getItem('pp_draft_' + id); } catch (e) {}
    // restore only over an empty or untouched (still at its default) field
    if (d && d !== el.value && (el.value === '' || el.value === el.defaultValue)) el.value = d;
  });
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t && DRAFT_IDS.includes(t.id)) draftSave(t.id, t.value);
});
window.addEventListener('pageshow', draftRestore);

const EYE_ON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
// Show/hide toggle. Same behaviour as the rest of the apps: icon flips, the
// label flips, and focus goes back to the field so typing isn't interrupted.
function togglePw(btn, id) {
  const i = document.getElementById(id);
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  btn.innerHTML = show ? EYE_OFF : EYE_ON;
  btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  btn.setAttribute('aria-pressed', String(show));
  i.focus();
}
function eyeBtn(id) {
  return `<button type="button" class="eye" onclick="togglePw(this,'${id}')" aria-label="Show password" aria-pressed="false">${EYE_ON}</button>`;
}
function msg(kind, text) {
  const m = document.getElementById('msg');
  if (!m) return;
  m.className = 'msg ' + kind; m.textContent = text;
}
function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// -------- auth views --------
// Turnstile sitekey (public, not a secret). Empty string = widget hidden and
// the server skips verification (TURNSTILE_SECRET unset). Fill both at launch.
const TURNSTILE_SITEKEY = ''; // Put your own Cloudflare Turnstile site key here, and set TURNSTILE_SECRET.
function renderSignupView() {
  render(`${brandHead()}
  <div class="card">
    <h2>Create your account</h2>
    ${S.billing ? '<p class="sub">Free tier: 30 items, 15 videos, 3 brand deals in play.</p>' : ''}

    ${TURNSTILE_SITEKEY ? '<div id="su-ts" style="margin-top:14px"></div>' : ''}
    <button class="btn" id="su-btn">Create account</button>
    <div id="msg" class="msg"></div>

// Loads the Turnstile script once, then renders the widget into #su-ts.
// CSP already allows challenges.cloudflare.com for script-src + frame-src.
let tsScriptLoading = null;
function mountTurnstile() {
  const renderWidget = () => {
    const slot = document.getElementById('su-ts');
    if (slot && window.turnstile && !slot.childElementCount) {
      window.turnstile.render(slot, { sitekey: TURNSTILE_SITEKEY });
    }
  };
  if (window.turnstile) return renderWidget();
  if (!tsScriptLoading) {
    tsScriptLoading = new Promise(resolve => {
      const s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      s.onload = resolve;
      document.head.appendChild(s);
    });
  }
  tsScriptLoading.then(renderWidget);
}
function viewSignup() { go({ view: 'signup' }); }
async function doSignup() {
  const email = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-pw').value;
  const password2 = document.getElementById('su-pw2').value;
  const btn = document.getElementById('su-btn');
  if (password.length < 10) return msg('err', 'Password must be at least 10 characters.');
  // You can't read a masked field, so a typo here would lock you out of your
  // own account. Catch it before the request goes out.
  if (password !== password2) return msg('err', 'Passwords do not match. Please re-type them.');
  btn.disabled = true;
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Chicago';
  const body = { email, password, tz };
  if (TURNSTILE_SITEKEY && window.turnstile) {
    body.turnstile_token = window.turnstile.getResponse(document.getElementById('su-ts')) || '';
    if (!body.turnstile_token) { btn.disabled = false; return msg('err', 'Please complete the "I\'m human" check first.'); }
  }
  const r = await app.call('/api/auth/signup', { method: 'POST', body });
  btn.disabled = false;
  if (r.ok && r.data.awaiting_verification) {
    pendingPw = password;
    viewVerify(email);
    // The server says whether the code actually went out. Never claim it did when it didn't.
    if (r.data.email_sent === false) msg('err', MAIL_FAIL_MSG);
  }
  else {
    // A failed/expired challenge must be re-solvable without a reload.
    if (TURNSTILE_SITEKEY && window.turnstile) window.turnstile.reset(document.getElementById('su-ts'));
    msg('err', r.data.error || 'Something went wrong.');
  }
}

const MAIL_FAIL_MSG = "We couldn't send your code right now. Try Resend code in a minute, or email support@example.com.";
// The password the user just typed on the signup or login form. Verifying a
// code needs the code AND the password (the code proves the inbox, the
// password proves who set the credentials), so it rides along to the verify
// view in memory; after a reload the view asks for it again.
let pendingPw = null;
function renderVerifyView(email) {
  render(`${brandHead()}
  <div class="card">
    <h2>Check your inbox</h2>
    <p class="sub">We sent a 6-digit code to <b>${esc(email)}</b>. Enter it below to finish.</p>
    <label for="vc-code">Verification code</label>
    <input id="vc-code" inputmode="numeric" maxlength="6" placeholder="123456">
    ${pendingPw ? '' : `<label for="vc-pw">Your password</label>
    <div class="pw-wrap"><input id="vc-pw" type="password" autocomplete="current-password" placeholder="The password you signed up with">${eyeBtn('vc-pw')}</div>`}
    <button class="btn" id="vc-btn">Verify &amp; continue</button>
    <button class="btn btn-ghost" id="vc-resend">Resend code</button>
    <div id="msg" class="msg"></div>
    <div class="switch"><a onclick="viewLogin()">Back to log in</a></div>
  </div>${legalFoot()}`);
  document.getElementById('vc-btn').onclick = () => doVerify(email);
  document.getElementById('vc-resend').onclick = async () => {
    const r = await app.call('/api/auth/resend-verification', { method: 'POST', body: { email } });
    if (r.ok && r.data.email_sent === false) return msg('err', MAIL_FAIL_MSG);
    msg(r.ok ? 'ok' : 'err', r.data.message || r.data.error || 'Sent.');
  };
}
function viewVerify(email) { go({ view: 'verify', email }); }
async function doVerify(email) {
  const code = document.getElementById('vc-code').value.replace(/\D/g, '');
  const btn = document.getElementById('vc-btn');
  if (code.length !== 6) return msg('err', 'Enter the 6-digit code.');
  const pwField = document.getElementById('vc-pw');
  const password = pendingPw || (pwField ? pwField.value : '');
  if (!password) return msg('err', 'Enter your password too.');
  btn.disabled = true;
  const r = await app.call('/api/auth/verify-code', { method: 'POST', body: { email, code, password } });
  btn.disabled = false;
  if (r.ok) { pendingPw = null; boot(); }
  else msg('err', r.data.error || 'That code is invalid or expired.');
}

function viewLogin() { go({ view: 'login' }); }
async function doLogin() {
  const email = document.getElementById('li-email').value.trim();
  const password = document.getElementById('li-pw').value;
  const btn = document.getElementById('li-btn');
  btn.disabled = true;
  const r = await app.call('/api/auth/login', { method: 'POST', body: { email, password } });
  btn.disabled = false;
  if (r.ok) { draftClear('li-email'); return boot(); }
  if (r.status === 403 && r.data.code === 'email_not_verified') { pendingPw = password; return viewVerify(r.data.email || email); }
  msg('err', r.data.error || 'Invalid credentials.');
}

function renderForgotView() {
  render(`${brandHead()}
  <div class="card">
    <h2>Reset your password</h2>
    <p class="sub">Enter your email and we'll send a reset link.</p>
    <label for="fp-email">Email</label>
    <input id="fp-email" type="email" autocomplete="username" placeholder="you@email.com">
    <button class="btn" id="fp-btn">Send reset link</button>
    <div id="msg" class="msg"></div>
    <div class="switch"><a onclick="viewLogin()">Back to log in</a></div>
  </div>${legalFoot()}`);
  document.getElementById('fp-btn').onclick = async () => {
    const email = document.getElementById('fp-email').value.trim();
    const r = await app.call('/api/auth/reset-request', { method: 'POST', body: { email } });
    // 429 is checked before any account lookup, so showing it leaks nothing.
    if (r.status === 429) return msg('err', r.data.error || 'Too many tries. Wait a few minutes and try again.');
    msg('ok', 'If that email has an account, a reset link is on its way.');
  };
}
function viewForgot() { go({ view: 'forgot' }); }

function renderResetView(token) {
  render(`${brandHead()}
  <div class="card">
    <h2>Set a new password</h2>
    <p class="sub">Choose a new password for your account.</p>
    <label for="rp-pw">New password</label>
    <div class="pw-wrap"><input id="rp-pw" type="password" autocomplete="new-password" placeholder="At least 10 characters">${eyeBtn('rp-pw')}</div>
    <label for="rp-pw2">Confirm new password</label>
    <div class="pw-wrap"><input id="rp-pw2" type="password" autocomplete="new-password" placeholder="Type it again">${eyeBtn('rp-pw2')}</div>
    <button class="btn" id="rp-btn">Save new password</button>
    <div id="msg" class="msg"></div>
  </div>${legalFoot()}`);
  document.getElementById('rp-btn').onclick = async () => {
    const password = document.getElementById('rp-pw').value;
    const password2 = document.getElementById('rp-pw2').value;
    if (password.length < 10) return msg('err', 'Password must be at least 10 characters.');
    if (password !== password2) return msg('err', 'Passwords do not match. Please re-type them.');
    const r = await app.call('/api/auth/reset-confirm', { method: 'POST', body: { token, password } });
    // The token is single-use — this page is now consumed. Replace (not push) so
    // Back can't return the user to a dead reset link, and strip it from the URL.
    if (r.ok) go({ view: 'login' }, { replace: true, url: '/app' });
    else msg('err', r.data.error || 'That reset link is invalid or expired.');
  };
}

// -------- date + streak helpers (user timezone, never UTC) --------
function tzDateOf(iso) {
  try {
    return new Intl.DateTimeFormat('en-CA', { timeZone: S.user.tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(iso));
  } catch { return String(iso).slice(0, 10); }
}
function tzToday() {
  try {
    return new Intl.DateTimeFormat('en-CA', { timeZone: S.user.tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  } catch { return new Date().toISOString().slice(0, 10); }
}
// Pure calendar math on YYYY-MM-DD strings (UTC internals, no local-tz leakage).
function dateAdd(dstr, days) {
  const [y, m, d] = dstr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + days));
  return dt.toISOString().slice(0, 10);
}
function daysBetween(a, b) {
  const p = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  return Math.round((p(b) - p(a)) / 86400000);
}
function weekStart(dstr) { // Monday of that calendar week
  const [y, m, d] = dstr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() - (dt.getUTCDay() + 6) % 7);
  return dt.toISOString().slice(0, 10);
}
// Weekly posting streak: consecutive calendar weeks with >=1 posted video.
// Still alive (grace) if this week has no post yet but last week did.
function calcStreak() {
  const weeks = new Set((S.videos || []).filter(v => v.status === 'posted' && v.posted_date).map(v => weekStart(v.posted_date)));
  if (!weeks.size) return { weeks: 0, postedThisWeek: false };
  let cur = weekStart(tzToday());
  const postedThisWeek = weeks.has(cur);
  if (!postedThisWeek) cur = dateAdd(cur, -7);
  let n = 0;
  while (weeks.has(cur)) { n++; cur = dateAdd(cur, -7); }
  return { weeks: n, postedThisWeek };
}
function itemAgeDays(it) {
  const start = it.date_received || (it.created_at || '').slice(0, 10);
  if (!start || !/^\d{4}-\d{2}-\d{2}$/.test(start)) return 0;
  return Math.max(0, daysBetween(start, tzToday()));
}
function filmQueue() {
  return (S.items || []).filter(i => i.status === 'received' || i.status === 'queued')
    .sort((a, b) => itemAgeDays(b) - itemAgeDays(a));
}

async function loadData(force) {
  if (!force && S.items && S.videos && S.deals && S.coupons && S.income) return;
  const [ri, rv, rd, rc, rm, ra] = await Promise.all([
    app.call('/api/items'), app.call('/api/videos'), app.call('/api/deals'), app.call('/api/coupons'), app.call('/api/income'),
    app.call('/api/achievements/sync', { method: 'POST', body: {} }),
  ]);
  if (ri.ok) S.items = ri.data.items;
  if (rv.ok) S.videos = rv.data.videos;
  if (rd.ok) S.deals = rd.data.deals;
  if (rc.ok) S.coupons = rc.data.coupons;
  if (rm.ok) { S.income = rm.data.months; S.incomeLocked = rm.data.locked_months || 0; }
  if (ra.ok) {
    S.unlocked = {};
    (ra.data.unlocked || []).forEach(a => { S.unlocked[a.key] = a.unlocked_at; });
    // rank-up detection (session-scoped; achievements are the persisted-once layer)

}

const monthLabel = (ym, short) => { const [y, mo] = ym.split('-').map(Number); return MN[mo - 1] + (short ? '' : ' ' + y); };
function fmtMoney(n) {
  const r = Math.round(n * 100) / 100;
  const frac = r % 1 ? 2 : 0; // whole dollars stay clean; cents always show both digits
  return '$' + r.toLocaleString('en-US', { minimumFractionDigits: frac, maximumFractionDigits: frac });
}
function paceInfo() {
  const today = tzToday();
  const row = (S.income || []).find(m => m.month === today.slice(0, 7));
  const total = row ? monthTotal(row) : 0;
  const day = Number(today.slice(8, 10)) || 1;
  return { total, day, pace: total / day, goal: S.user.pace_goal || 0 };
}

// Follow-ups due, tz-correct: date-string compare against today in user tz.
function followUps() {
  const today = tzToday();
  const active = (S.deals || []).filter(d => d.status !== 'dead' && d.status !== 'paid' && d.next_follow_up);
  return {
    overdue: active.filter(d => d.next_follow_up < today),
    today: active.filter(d => d.next_follow_up === today),
  };
}
function couponBuckets() {
  const today = tzToday();
  const live = (S.coupons || []).filter(c => !c.used);
  return {
    expired: live.filter(c => c.expires && c.expires < today),
    soon: live.filter(c => c.expires && c.expires >= today && daysBetween(today, c.expires) <= 14),
  };
}

// -------- effects --------
function burst(x, y, count = 12) {
  if (REDUCED) return;
  const colors = ['#C2255C', '#F2A93B', '#C9A87C', '#8C94A8'];
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + Math.random() * 0.5;
    const dist = 50 + Math.random() * 70;
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = x + 'px'; p.style.top = y + 'px';
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    p.style.setProperty('--rot', Math.random() * 720 - 360 + 'deg');
    p.style.setProperty('--dur', (0.6 + Math.random() * 0.5) + 's');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1200);
  }
}

        </div>
        <div id="tabbody"><div class="spinner"></div></div>
      </div>
    </div>${legalFoot()}`, 'appwrap');

  const gp = document.getElementById('hdr-gopro');
  if (gp) gp.onclick = () => openPanel({ type: 'upgrade' });
  document.getElementById('hdr-help').onclick = () => openPanel({ type: 'help' });
  document.getElementById('tabs').onclick = e => {
    const b = e.target.closest('.tab');
    if (!b) return;
    if (b.dataset.tab === S.tab && !S.sub && !S.panel) return; // already here — no duplicate history entry
    go({ view: 'app', tab: b.dataset.tab });
  };
  const bw = document.getElementById('bandit-wrap');
  bw.onclick = () => {
    banditSay(TRASH_TALK[Math.floor(Math.random() * TRASH_TALK.length)]);
    banditState('state-pleased', 1000);
    const r = bw.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 10);
  };
  startBlinking();
  if (S.items === null) {
    loadData().then(() => { banditSay(banditLine()); refreshChar(); renderTab(); setTimeout(processCelebQueue, 600); maybeAskPaceGoal(); });
    refreshChar();
  } else { refreshChar(); renderTab(); }
}

function refreshChar() {
  const el = document.getElementById('charstat');
  if (!el) return;
  if (S.videos === null) { el.innerHTML = `<div class="lbl">Posting streak</div><div class="val">…</div>`; return; }
  const st = calcStreak();
  const pct = Math.min(100, Math.round(st.weeks / 12 * 100));
  const hint = st.weeks === 0 ? 'Post a video to start the streak'
    : st.postedThisWeek ? 'This week is in the books'
    : 'Post this week to keep it alive';
  const posted = postedCount();
  const rIdx = rankIndexFor(posted);
  const next = RANKS[rIdx + 1];
  const rPct = next ? Math.min(100, Math.round((posted - RANKS[rIdx][1]) / (next[1] - RANKS[rIdx][1]) * 100)) : 100;
  el.innerHTML = `<div class="lbl">Rank</div>
    <div class="rankname">${RANKS[rIdx][0]}</div>
    <div class="bar"><i style="width:${rPct}%"></i></div>
    <div class="lbl" style="margin-top:4px">${next ? `${posted}/${next[1]} videos to ${next[0]}` : `${posted} videos, top of the ladder`}</div>
    <div class="lbl" style="margin-top:10px">Posting streak</div>
    <div class="val">${st.weeks} week${st.weeks === 1 ? '' : 's'}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="lbl" style="margin-top:6px">${hint}</div>
    <button class="badgelink" id="open-badges">Badges: ${Object.keys(S.unlocked || {}).length}/${ACH_ORDER.length}, see all</button>`;
  const bl = document.getElementById('open-badges');
  if (bl) bl.onclick = () => openPanel({ type: 'badges' });
  applyRankAccessories(rIdx);
}

// Rank shows on Bandit himself: the box fort grows a level at each rank.
function applyRankAccessories(rIdx) {
  const b = document.getElementById('bandit');
  if (!b || b.dataset.rank === String(rIdx)) return;
  b.dataset.rank = String(rIdx);
  b.innerHTML = banditSVG(rIdx);
}

// After any data mutation: re-pull, repaint everything data-driven.
async function refresh() {
  await loadData(true);
  refreshChar();
  banditSay(banditLine());
  renderTab();
  setTimeout(processCelebQueue, 350);
}

function renderTab() {
  const b = document.getElementById('tabbody');
  if (!b) return;
  if (S.tab !== 'settings' && S.items === null) {
    b.innerHTML = '<div class="spinner"></div>';
    return;

  if (S.tab === 'today') b.innerHTML = tabToday();

  else if (S.tab === 'videos') b.innerHTML = tabVideos();
  else if (S.tab === 'deals') b.innerHTML = tabDeals();
  else if (S.tab === 'coupons') b.innerHTML = tabCoupons();
  else if (S.tab === 'income') b.innerHTML = tabIncome();
  else b.innerHTML = tabSettings();
  wireTab();
  draftRestore();
  renderPanel();
}

// isAff decides "someone else's link" vs "one of the creator's own". Own domains are
// never labelled or marked as affiliate. A new own domain must be added here.
function isAff(url) {
  var OWN = ['porchpile.com', 'giveawaywidget.com', 'buildabio.com', 'resumeprune.com',
    'jenbuiltit.com', 'dopaminedealerhabits.com', 'sidehustlegarden.com',
    'subscriptiongraveyard.app', 'emergencyfundaquarium.com', 'energybattery.app',
    'seedingserendipity.com', 'jentriedit.com', 'jen8n.com', 'adminarcade.com'];
  return !!url && !OWN.some(d => url.includes(d));
}
// Stable rotation: same pick all day, moves on tomorrow. The seed offset keeps
// two surfaces on the same screen from landing on the same entry.
function dayIndex(offset) {
  const day = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
  return day + (offset || 0);
}
// Promos eligible for a surface. Paid links are free-tier only: a Pro subscriber
// is already paying, so we never sell to them. Untagged promos fit any tab.
function nudgePool(ctx) {
  const pool = NUDGES.filter(n => !(n.aff && S.user && S.user.pro));
  if (!ctx) return pool;
  const fit = pool.filter(n => !n.ctx || n.ctx === ctx);
  return fit.length ? fit : pool;
}
// Card body, shared by every surface. `actAttr` differs: the Today card wires its
// action through data-act, the celebration popup through data-nudge-act.
function nudgeBody(nudge, actAttr) {
  const aff = !!nudge.href && isAff(nudge.href);
  // rel starts with the literal noopener noreferrer so the security scanner can
  // see it; paid links add sponsored + nofollow on top.
  const paidRel = aff ? ' sponsored nofollow' : '';
  const act = actAttr === 'data-act'
    ? `data-act="${esc(nudge.act || '')}"`
    : `data-nudge-act="${esc(nudge.act || '')}"`;
  return `<div class="tip-text">${esc(nudge.text)}</div>
    ${nudge.href ? `<a class="tip-cta" href="${esc(nudge.href)}" target="_blank" rel="noopener noreferrer${paidRel}">${esc(nudge.cta)} →</a>`
                 : `<span class="tip-cta" ${act}>${esc(nudge.cta)} →</span>`}
    ${nudge.href ? `<div class="tip-disc">${esc(aff ? (nudge.disc || NUDGE_DISC) : NUDGE_OWN)}</div>` : ''}`;
}
// Today only. App help, never a promo.
function appTipCard() {
  const tip = TIPS[dayIndex(0) % TIPS.length];
  return `<div class="tip-card" style="margin-top:16px">${nudgeBody(tip, 'data-act')}</div>`;
}
// One quiet promo at the bottom of a tab, under the real content. The offset is
// derived from the tab so Pile and Videos don't rotate in lockstep.
function promoCard(ctx) {
  const pool = nudgePool(ctx);
  if (!pool.length) return '';
  const offset = String(ctx || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  const n = pool[dayIndex(offset) % pool.length];
  return `<div class="tip-card promo-card">${nudgeBody(n, 'data-act')}</div>`;
}
// Settings: every promo at once, grouped, permanent, out of the way. This is the
// home for the ones no single tab fits.
function toolsIUseCard() {
  // Deliberately NOT nudgePool(): Pro subscribers see the paid rows here too.
  const FIRST = ['OINK for Influencers', 'Levanta', 'Logie'];  // these show first
  const rank = n => { const i = FIRST.indexOf(n.name); return i < 0 ? FIRST.length : i; };
  const theirs = NUDGES.filter(n => n.href && isAff(n.href)).sort((a, b) => rank(a) - rank(b));
  const mine = NUDGES.filter(n => n.href && !isAff(n.href));
  const row = (n) => `<div class="tool-row">
      <a href="${esc(n.href)}" target="_blank" rel="noopener noreferrer sponsored nofollow">${esc(n.name || n.cta)}</a>
      <span class="tool-what">${esc(n.text)}</span>
      <span class="tool-note">${esc(n.disc || NUDGE_DISC)}</span>
    </div>`;
  const chip = (n) => `<a class="tool-chip" href="${esc(n.href)}" target="_blank" rel="noopener noreferrer">${esc(n.name || n.cta)}</a>`;
  return `<div class="card" style="margin-top:16px">
    <h2>Tools from Porch Pile’s creator</h2>
    <p class="sub">Tools Jen Soltys, who made Porch Pile, uses for her own Amazon Influencer reviews. Nothing here is required to use Porch Pile.</p>
    ${theirs.map(row).join('')}
    ${mine.length ? `<h3 class="tool-h">Built by Porch Pile’s creator</h3><div class="tool-chips">${mine.map(chip).join('')}</div>` : ''}
  </div>`;
}

// ---- Income (charts per the dataviz skill: thin marks, 2px gaps, legend,
// tooltips, table view = the month rows below; one axis; text in text tokens)
function stackedBarSVG(rows) {
  const W = 560, H = 210, padL = 56, padR = 8, padT = 12, padB = 24;
  const iw = W - padL - padR, ih = H - padT - padB;
  const max = Math.max(...rows.map(monthTotal), 1);
  const bw = Math.max(10, Math.min(44, Math.floor(iw / rows.length) - 10));
  const step = iw / rows.length;
  let out = '';
  // recessive grid: 0 / half / max
  [0, 0.5, 1].forEach(f => {
    const y = padT + ih - ih * f;
    out += `<line class="grid" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"/>`;
    out += `<text x="${padL - 6}" y="${y + 3}" text-anchor="end">${fmtMoney(max * f)}</text>`;
  });
  rows.forEach((m, i) => {
    const x = padL + step * i + (step - bw) / 2;
    let yCursor = padT + ih;
    const total = monthTotal(m);
    const segs = STREAMS.map(([k, label, color]) => ({ k, label, color, v: Number(m[k]) || 0 })).filter(s => s.v > 0);
    segs.forEach((s, si) => {
      const hFull = (s.v / max) * ih;
      const yTop = yCursor - hFull;
      const isTop = si === segs.length - 1;
      const tip = `${monthLabel(m.month)} · ${s.label}: ${fmtMoney(s.v)} (month ${fmtMoney(total)})`;
      if (isTop && hFull > 5) {
        // rounded data-end on the top of the stack
        const r = 3;
        out += `<path d="M${x} ${yCursor} L${x} ${yTop + r} Q${x} ${yTop} ${x + r} ${yTop} L${x + bw - r} ${yTop} Q${x + bw} ${yTop} ${x + bw} ${yTop + r} L${x + bw} ${yCursor} Z" fill="${s.color}" data-tip="${esc(tip)}"/>`;
      } else {
        // shave 2px off the top: the 2px surface gap between this fill and the
        // one stacked above it; the bottom edge stays anchored
        out += `<rect x="${x}" y="${yTop + 2}" width="${bw}" height="${Math.max(0.5, hFull - 2)}" fill="${s.color}" data-tip="${esc(tip)}"/>`;
      }
      yCursor = yTop;
    });
    const every = rows.length > 8 ? 2 : 1;
    if (i % every === 0) out += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${monthLabel(m.month, true)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly income by stream">${out}</svg>`;
}

function donutSVG(totals, grand) {
  const R = 44, CX = 60, CY = 60, SW = 18;
  const C = 2 * Math.PI * R;
  let acc = 0, out = '';
  totals.filter(t => t.v > 0).forEach(t => {
    const frac = t.v / grand;
    const len = Math.max(0, frac * C - 2); // 2px gap between segments
    out += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${t.color}" stroke-width="${SW}"
      stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-acc * C}" transform="rotate(-90 ${CX} ${CY})"
      data-tip="${esc(t.label + ': ' + fmtMoney(t.v) + ' (' + Math.round(frac * 100) + '%)')}"/>`;
    acc += frac;
  });
  return `<svg width="120" height="120" viewBox="0 0 120 120" class="chart" role="img" aria-label="All-time split by stream">${out}
    <text x="${CX}" y="${CY - 2}" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#1D2A22">${fmtMoney(grand)}</text>
    <text x="${CX}" y="${CY + 13}" text-anchor="middle">all-time</text></svg>`;
}

// Renewal-law disclosure: amount + interval + how to cancel, in visual

let upInterval = 'monthly';

function renewalLine() {

// The block can be on the page twice at once (Settings Pro card + the upgrade
// panel over it), so it carries classes, not ids, and wirePricing takes the
// container it should wire. getElementById here once left the panel's Go Pro
// dead whenever it opened over Settings.
// quiet: the Settings Pro card, where "Save settings" is the one filled button.
function pricingBlockHTML(quiet) {
  // No Stripe on this server: no prices, no checkout button.

  return `<div class="pricing">

    <p class="hint pp-renew">${renewalLine()}</p>

  </div>`;

function wirePricing(root) {
  (root || document).querySelectorAll('.pricing').forEach(block => wirePricingBlock(block));
}
function wirePricingBlock(block) {
  block.querySelectorAll('.pillck').forEach(b => b.onclick = () => {
    upInterval = b.dataset.int;
    // Every pricing block on the page follows the one choice.
    document.querySelectorAll('.pricing .pillck').forEach(x => { const on = x.dataset.int === upInterval; x.classList.toggle('on', on); x.setAttribute('aria-pressed', String(on)); });
    document.querySelectorAll('.pricing .pp-renew').forEach(rl => { rl.textContent = renewalLine(); });
  });
  const goBtn = block.querySelector('.pp-go');
  if (goBtn) goBtn.onclick = async () => {
    goBtn.disabled = true;
    const body = { interval: upInterval };
    const ref = (function(){try{var k='pp_aff_ref',t=+localStorage.getItem(k+'_at')||0,v=localStorage.getItem(k);if(!v)return null;if(!t){localStorage.setItem(k+'_at',String(Date.now()));return v}if(Date.now()-t>5184e6){localStorage.removeItem(k);localStorage.removeItem(k+'_at');return null}return v}catch(e){return null}})();
    if (ref) body.ref = ref;
    const r = await app.call('/api/stripe/create-checkout', { method: 'POST', body });
    goBtn.disabled = false;
    if (r.ok && r.data.url) location.href = r.data.url;
    else toast(r.data.error || 'Could not start checkout. Try again in a minute.');
  };
}

// A free-cap 403 becomes the upgrade panel: swap it in place of whatever form
// panel was open (replace, so Back leaves the app view, not a dead form).
function capHit(r) {
  if (!(r.status === 403 && r.data && r.data.code === 'cap_reached')) return false;
  S.panel = null;
  go({ view: 'app', tab: S.tab, sub: S.sub, adv: S.adv || undefined, panel: { type: 'upgrade', cap: r.data.cap } }, { replace: true });

}

  return `<h2>That's a full porch</h2>

}
// Return-from-checkout: entitlement comes from SYNCED state, never from the
// success URL param (the webhook may still be in flight).
async function finalizeUpgrade() {
  toast('Finishing your upgrade…');
  for (let i = 0; i < 6; i++) {
    const r = await app.call('/api/stripe/sync', { method: 'POST' });
    if (r.ok && r.data.pro) {
      const m = await app.call('/api/me');
      if (m.ok) S.user = m.data.user;
      localStorage.removeItem('pp_aff_ref'); localStorage.removeItem('pp_aff_ref_at');
      renderAppView();
      banditSay('PRO. The whole porch is yours now.');
      banditState('state-celebrating', 1800);
      burst(innerWidth / 2, innerHeight / 3, 18);
      toast('You are Pro. Every limit is off.');
      return;
    }
    await new Promise(rs => setTimeout(rs, 1500));
  }
  toast("Payment received. Pro is taking a moment to activate; refresh in a minute if it hasn't flipped.");
}

// Runs after first data load. Only a brand-new account (tour never seen, empty

// -------- guided tour: six stops, skippable, re-runnable from the help panel --------
// One overlay pinned to the bottom; each stop highlights a real element with a
// ring. Kept OUT of history on purpose: pressing Back ends the tour instead of
// replaying it, so it can never trap anyone.
const TOUR_STOPS = [
  { tab: null, sel: null, text: "New here? I'm Bandit. Let me show you around. Six quick stops, or skip any time." },
  { tab: 'today', sel: '#tabbody .tiles', text: 'This is Today, your starting point. These tiles tell you what needs doing: what to film next, who to follow up with, and how the month is going.' },
  { tab: 'pile', sel: '[data-act="additem"]', text: 'The Pile is every product you track. This button adds one. Type a name and save. Details can wait.' },
  { tab: 'pile', sel: '.seg', text: 'Film next lines up what to film, in order. Film the top one and tap it forward. That keeps the pile moving.' },
  { tab: 'deals', sel: '.quickadd', text: 'When a brand messages you, type its name here and save before the tab closes. I set a follow-up date so nothing goes cold.' },
  { tab: 'income', sel: '#tabbody', text: 'Income is one row per month: what you made. Log it and the Today tab starts showing your daily pace.' },
  { tab: 'settings', sel: '#adv-settings', text: "Settings has your account and your pace goal. Advanced has the import for a whole spreadsheet of products. And the ? button up top reopens the guide any time. That's the tour!" },
];

function tourSeen() { try { return localStorage.getItem('pp_tour_done') === '1'; } catch { return false; } }
function tourMarkSeen() { try { localStorage.setItem('pp_tour_done', '1'); } catch {} }

function startTour() {
  endTour(); // never two overlays
  S.tourStep = 0;
  // ONE history entry for the whole tour, never one per stop and never none.
  // None (what this did before) meant a Back press ended the tour AND left the
  // app, which breaks the fleet back-button rule. One per stop would replay the
  // tour backwards and trap you. One entry ends the tour and keeps you here.
  nav({ view: 'app', tab: S.tab, sub: S.sub, panel: S.panel, tour: true });
  renderTourStep();
}

// fromHistory=true means popstate is already unwinding the entry — tear down
// directly, or calling history.back() again would loop.
function endTour(fromHistory) {
  if (S.tourStep === undefined) return;
  S.tourStep = undefined;
  tourMarkSeen();
  const box = document.getElementById('tourbox');
  if (box) box.remove();
  const ring = document.getElementById('tourring');
  if (ring) ring.remove();
  // Consume the entry the tour pushed, so the on-screen Skip/Done button and
  // the browser Back button stay in sync (no dead presses).
  if (!fromHistory && history.state && history.state.tour) history.back();
}

// Phone keyboard: hide the fixed tour box while a field outside it has focus, so it never covers the field.
document.addEventListener('focusin', e => {
  const tb = document.getElementById('tourbox');
  if (tb && e.target.matches && e.target.matches('input,select,textarea') && !tb.contains(e.target)) tb.style.visibility = 'hidden';
});
document.addEventListener('focusout', () => {
  const tb = document.getElementById('tourbox');
  if (tb) tb.style.visibility = '';
});
function renderTourStep() {
  const n = S.tourStep;
  const stop = TOUR_STOPS[n];
  if (!stop) return endTour();

  const show = () => {
    const old = document.getElementById('tourbox'); if (old) old.remove();
    const oldRing = document.getElementById('tourring'); if (oldRing) oldRing.remove();

    if (stop.sel) {
      const el = document.querySelector(stop.sel);
      if (el) {
        el.scrollIntoView({ block: 'center', behavior: 'instant' });
        const r = el.getBoundingClientRect();
        const ring = document.createElement('div');
        ring.id = 'tourring';
        ring.style.cssText = `position:fixed;left:${r.left - 6}px;top:${r.top - 6}px;width:${r.width + 12}px;height:${r.height + 12}px;`;
        document.body.appendChild(ring);
      }
    }

    const box = document.createElement('div');
    box.id = 'tourbox';
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-label', 'App tour');
    box.innerHTML = `
      <p>${esc(stop.text)}</p>
      <div class="tourrow">
        <span class="tourcount">${n === 0 ? '' : `${n} of ${TOUR_STOPS.length - 1}`}</span>
        <button class="btn btn-ghost" id="tour-skip">${n === TOUR_STOPS.length - 1 ? 'Done' : n === 0 ? 'No thanks' : 'Skip'}</button>
        ${n < TOUR_STOPS.length - 1 ? `<button class="btn" id="tour-next">${n === 0 ? 'Show me' : 'Next'}</button>` : ''}
      </div>`;
    document.body.appendChild(box);
    document.getElementById('tour-skip').onclick = () => endTour();
    const next = document.getElementById('tour-next');
    if (next) next.onclick = () => { S.tourStep = n + 1; renderTourStep(); };
  };

  // Switch to the stop's tab first; the highlight target renders with the tab.
  if (stop.tab && S.tab !== stop.tab) {
    // REPLACE, and keep tour:true on the entry. Pushing per stop would stack an
    // entry per tab and let Back walk the tour backwards; dropping the tour flag
    // would make the next Back read as "left the tour" one stop early.
    go({ view: 'app', tab: stop.tab, tour: true }, { replace: true });
    setTimeout(show, 60);
  } else {
    show();
  }
}

function maybeOfferTour() {
  if (tourSeen()) return;
  if ((S.items || []).length) { tourMarkSeen(); return; } // not new, don't nag
  startTour();
}

async function undoRecentImport(...a) {
  if (undoRecentImport.busy) return;
  undoRecentImport.busy = true;
  try { return await undoRecentImportRun(...a); } finally { undoRecentImport.busy = false; }
}
async function undoRecentImportRun(batchId) {
  if (!confirm('Remove everything from that import? Items you edited since stay put.')) return;
  const r = await app.call('/api/items/import/' + batchId, { method: 'DELETE' });
  if (!r.ok) return toast(r.data.error || 'Could not undo that import.');
  await refresh();
  toast(r.data.kept > 0
    ? `Removed ${r.data.deleted} imported items. I kept ${r.data.kept} you'd already edited.`
    : `Removed ${r.data.deleted} imported item${r.data.deleted === 1 ? '' : 's'}.`);
}

// ---- the four-step wizard. Each step is one history entry (back-button
// rule): gotoImportStep pushes, popstate re-renders the step it lands on, and
// depthByStep lets Cancel unwind exactly the entries the wizard pushed.
const IMP_FIELD_LABEL = {
  name: 'Product name', brand: 'Brand', asin: 'ASIN', date_received: 'Date received',
  est_value: 'Estimated value', category: 'Category', notes: 'Notes',
  source: 'How I got it', channel: 'Channel', status: 'Status',
};

function openImport() {
  S.imp = {
    parsed: null, mapping: {}, valueMaps: {}, filename: '',
    defaults: { status: 'received', source: 'sent_for_review' },
    updateExisting: false, importing: false, depth: 0, depthByStep: {},
  };
  gotoImportStep(1);
}

function gotoImportStep(n) {
  S.imp.depth += 1;
  S.imp.depthByStep[n] = S.imp.depth;
  go({ view: 'app', tab: S.tab, sub: S.sub, adv: S.adv || undefined, panel: { type: 'import', step: n } });
}

function closeImportWizard() {
  if (!S.imp) return;
  const depth = S.imp.depth || 0;
  // Close NOW, synchronously — same rule as closePanel. The history unwind
  // lands on the entry beneath the wizard (Settings) via popstate.
  S.imp = null; S.panel = null;
  const o = document.getElementById('overlay');
  if (o) o.remove();
  if (depth) history.go(-depth);
}

function importWizardHTML(step) {
  if (step === 1) return impStep1HTML();
  if (step === 2) return impStep2HTML();

}

function impValueFields() {
  // Only fields that are mapped AND have values in the file: a column that is
  // empty in every row has nothing to ask about.
  return ['source', 'channel', 'status'].filter(f => S.imp.mapping[f] !== undefined
    && window.ImportLib.distinctValues(S.imp.parsed.rows, S.imp.mapping[f]).length);
}

function impStep3HTML() {
  const L = window.ImportLib;
  const OPTIONS = {
    source: SOURCES, channel: CHANNELS,
    status: ITEM_STATUSES.map(s => [s, STATUS_LABEL[s]]),
  };
  const sections = impValueFields().map(f => {
    const col = S.imp.mapping[f];
    const all = L.distinctValues(S.imp.parsed.rows, col);
    if (!all.length) return ''; // mapped column with no values: nothing to ask
    const values = all.slice(0, 50);
    const vm = S.imp.valueMaps[f] || {};
    const rows = values.map(v => {
      const implied = f === 'channel' ? L.guessSourceFromChannelValue(v) : null;
      const impliedLabel = implied ? (SOURCES.find(([k]) => k === implied) || [])[1] : null;
      return `<div class="imp-row">
        <div class="imp-h"><b>${esc(v.slice(0, 44))}</b></div>

          <option value="">Leave it to the default</option>
          ${OPTIONS[f].map(([k, l]) => `<option value="${k}" ${vm[v] === k ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
        ${impliedLabel ? `<div class="imp-implied">Also sets how you got it: ${impliedLabel}</div>` : ''}
      </div>`;
    }).join('');
    const capNote = all.length > 50 ? `<p class="hint">Showing the first 50 of ${all.length} different values. The rest get the default.</p>` : '';
    return `<h3>${IMP_FIELD_LABEL[f]}: your "${esc(S.imp.parsed.headers[col])}" column</h3>${rows}${capNote}`;
  }).join('');

      <button class="btn btn-ghost" id="imp-cancel">Cancel import</button>
