function impBuild() {
  const L = window.ImportLib;
  const built = L.buildRows(S.imp.parsed, S.imp.mapping, S.imp.valueMaps, S.imp.defaults);
  const dup = L.findDuplicates(built.rows, S.items || []);
  return { ...built, dup };
}

function impStep4HTML() {
  const { rows, errors, dup } = impBuild();
  const over = rows.length > 5000;
  const dupCount = dup.dupIndexes.size;
  const toSend = S.imp.updateExisting ? rows.length : rows.length - dupCount;
  const prevRows = rows.slice(0, 5).map(r => `<tr>
      <td>${esc(r.name)}</td><td>${esc(r.brand || '')}</td><td>${STATUS_LABEL[r.status] || esc(r.status)}</td>
      <td>${esc(r.date_received || '')}</td><td>${r.est_value !== undefined ? '$' + r.est_value : ''}</td>
    </tr>`).join('');
  const def = S.imp.defaults.status;
  return `<h2>Ready to import</h2>
    <p class="sub">Are these already filmed and posted, waiting to film, or not even here yet?</p>
    <div class="imp-choice" role="group" aria-label="What status should these start with">
      <button class="pillck ${def === 'linked' ? 'on' : ''}" id="imp-def-done" aria-pressed="${def === 'linked'}">Already done</button>
      <button class="pillck ${def === 'received' ? 'on' : ''}" id="imp-def-waiting" aria-pressed="${def === 'received'}">Waiting to film</button>
      <button class="pillck ${def === 'sending' ? 'on' : ''}" id="imp-def-sending" aria-pressed="${def === 'sending'}">Still on the way</button>
    </div>
    <div class="imp-prev"><table>
      <thead><tr><th>Name</th><th>Brand</th><th>Status</th><th>Received</th><th>Value</th></tr></thead>
      <tbody>${prevRows}</tbody>
    </table></div>
    <p class="hint" id="imp-count"><b>${toSend} item${toSend === 1 ? '' : 's'} ready to import.</b></p>
    ${dupCount ? `<p class="hint">${dupCount} of these ${dupCount === 1 ? 'is' : 'are'} already in your pile. I'll skip ${dupCount === 1 ? 'it' : 'them'}.
      <label style="display:block;margin-top:4px"><input type="checkbox" id="imp-upd" ${S.imp.updateExisting ? 'checked' : ''} style="width:auto;margin-right:6px">Update the ones I already have instead</label></p>` : ''}
    ${errors.length ? `<p class="hint">${errors.length} row${errors.length === 1 ? ' has' : 's have'} no product name, so I'll leave ${errors.length === 1 ? 'it' : 'them'} out.</p>` : ''}
    ${over ? `<p class="hint">One import can bring in up to 5,000 rows. Split the file and import it in two goes.</p>` : ''}
    <div id="imp-progress" class="msg"></div>
    <div id="imp-err" class="msg"></div>
    <div class="imp-foot">
      <button class="btn" id="imp-run" ${over || !toSend || S.imp.importing ? 'disabled' : ''}>Import</button>
      <button class="btn btn-ghost" id="imp-cancel" ${S.imp.importing ? 'disabled' : ''}>Cancel import</button>
    </div>`;
}

function showImportError(text) {
  const el = document.getElementById('imp-err');
  if (el) { el.className = 'msg err'; el.textContent = text; }
  else toast(text);
}

function computeValueMaps() {
  const L = window.ImportLib;
  const vm = {};
  for (const f of impValueFields()) {
    const m = {};
    for (const v of L.distinctValues(S.imp.parsed.rows, S.imp.mapping[f]).slice(0, 50)) {
      const g = L.guessValue(f, v);
      if (g) m[v] = g;
    }
    vm[f] = m;
  }
  S.imp.valueMaps = vm;
}

function wireImportPanel(step) {
  const $ = id => document.getElementById(id);
  const cancel = $('imp-cancel');
  if (cancel) cancel.onclick = () => closeImportWizard();

  if (step === 1) {
    $('imp-file').onchange = e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) {
        showImportError("That file is bigger than 10 MB. If it's really that big, split it and import it in two goes.");
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          S.imp.parsed = window.ImportLib.parseCsv(reader.result);
        } catch (err) {
          showImportError(err.message);
          return;
        }
        S.imp.filename = file.name;
        S.imp.mapping = window.ImportLib.guessColumns(S.imp.parsed.headers);
        gotoImportStep(2);
      };
      reader.readAsText(file);
    };
  }

  if (step === 2) {
    document.querySelectorAll('[data-impcol]').forEach(sel => sel.onchange = () => {
      const col = Number(sel.dataset.impcol);
      const field = sel.value;
      // One field, one column: claiming a field steals it from any other column,
      // and whatever this column meant before is dropped.
      for (const f of Object.keys(S.imp.mapping)) {
        if (S.imp.mapping[f] === col) delete S.imp.mapping[f];
      }
      if (field) S.imp.mapping[field] = col;
      renderPanel();
    });
    const next = $('imp-next2');
    if (next) next.onclick = () => {
      computeValueMaps();
      gotoImportStep(impValueFields().length ? 3 : 4);
    };
  }

  if (step === 3) {
    document.querySelectorAll('[data-impval]').forEach(sel => sel.onchange = () => {
      const f = sel.dataset.impval, raw = sel.dataset.impraw;
      if (!S.imp.valueMaps[f]) S.imp.valueMaps[f] = {};
      if (sel.value) S.imp.valueMaps[f][raw] = sel.value;
      else delete S.imp.valueMaps[f][raw];
    });
    const next = $('imp-next3');
    if (next) next.onclick = () => gotoImportStep(4);
  }

  if (step === 4) {
    const setDefault = st => { S.imp.defaults.status = st; renderPanel(); };
    $('imp-def-done').onclick = () => setDefault('linked');
    $('imp-def-waiting').onclick = () => setDefault('received');
    $('imp-def-sending').onclick = () => setDefault('sending');
    const upd = $('imp-upd');
    if (upd) upd.onchange = () => { S.imp.updateExisting = upd.checked; renderPanel(); };
    $('imp-run').onclick = () => runImport();
  }
}

async function runImport() {
  const { rows, dup } = impBuild();
  const toSend = rows.filter((_, i) => S.imp.updateExisting || !dup.dupIndexes.has(i));
  if (!toSend.length || rows.length > 5000) return;
  S.imp.importing = true;
  const runBtn = document.getElementById('imp-run');
  const cancelBtn = document.getElementById('imp-cancel');
  if (runBtn) runBtn.disabled = true;
  if (cancelBtn) cancelBtn.disabled = true;

  const batchId = crypto.randomUUID();
  const totals = { inserted: 0, updated: 0, skipped: 0, failed: 0 };
  const progress = document.getElementById('imp-progress');
  for (let i = 0; i < toSend.length; i += 100) {
    const chunk = toSend.slice(i, i + 100);
    const r = await app.call('/api/items/import', {
      method: 'POST',
      body: {
        batch_id: batchId, filename: S.imp.filename, start_index: i,
        final: i + chunk.length >= toSend.length,
        rows: chunk, update_existing: !!S.imp.updateExisting,
      },
    });
    if (!r.ok) {
      S.imp.importing = false;
      if (runBtn) runBtn.disabled = false;
      if (cancelBtn) cancelBtn.disabled = false;
      showImportError(totals.inserted
        ? `Something went wrong partway through. ${totals.inserted} items came in. You can undo this from Settings, under Advanced, and try again.`
        : (r.data.error || "Something went wrong. Nothing came in yet, so it's safe to try again."));
      return;
    }
    totals.inserted += r.data.inserted || 0; totals.updated += r.data.updated || 0;
    totals.skipped += r.data.skipped || 0; totals.failed += r.data.failed || 0;
    if (progress) { progress.className = 'msg ok'; progress.textContent = `Bringing in ${toSend.length} items. ${Math.min(i + chunk.length, toSend.length)} so far.`; }
  }

  const n = totals.inserted + totals.updated;
  await loadData(true);
  // Land on the Pile. Replace the wizard's top history entry; the entries
  // beneath it are consumed by renderPanel's dead-entry guard on Back.
  S.imp = null; S.panel = null;
  const o = document.getElementById('overlay');
  if (o) o.remove();
  go({ view: 'app', tab: 'pile' }, { replace: true });
  refreshChar();
  banditState('state-celebrating', 1800);
  toast(`${n} item${n === 1 ? ' is' : 's are'} in your pile.`);
}

// -------- keyboard focus for dialogs (audit A15) --------
// Tab and Shift+Tab cycle inside the open dialog, and focus goes back to the
// button that opened it when it closes (if that button is still on screen).
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function trapFocus(el) {
  el.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const f = [...el.querySelectorAll(FOCUSABLE)].filter(x => x.offsetParent !== null);
    if (!f.length) { e.preventDefault(); return; }
    const first = f[0], last = f[f.length - 1], cur = document.activeElement;
    if (e.shiftKey && (cur === first || !el.contains(cur))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (cur === last || !el.contains(cur))) { e.preventDefault(); first.focus(); }
  });
}
function refocus(el) { if (el && el.isConnected && typeof el.focus === 'function') { try { el.focus(); } catch {} } }
// The app re-renders on navigation, so the opener node is often replaced by
// the time a panel closes. Remember how to find it again (id or data-*).
function focusKey(el) {
  if (!el || el === document.body) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  for (const a of el.attributes) if (a.name.startsWith('data-')) return `[${a.name}="${CSS.escape(a.value)}"]`;
  return null;
}
let panelOpener = null, panelOpenerKey = null;
function restorePanelFocus() {
  const el = panelOpener, key = panelOpenerKey;
  panelOpener = panelOpenerKey = null;
  // After the popstate re-render settles.
  setTimeout(() => {
    if (S.panel) return; // another panel opened meanwhile
    refocus(el && el.isConnected ? el : (key ? document.querySelector(key) : null));
  }, 60);
}

// -------- overlay panels (each open = one history entry; Back closes it) --------
function openPanel(panel) {
  // Capture the opener BEFORE go() re-renders the page under the panel.
  if (!S.panel) { panelOpener = document.activeElement; panelOpenerKey = focusKey(panelOpener); }
  go({ view: 'app', tab: S.tab, sub: S.sub, adv: S.adv || undefined, panel });
}
function closePanel() {
  // Close NOW, synchronously — never wait on the popstate round-trip. If the
  // close raced a data refresh, the refresh's renderPanel() used to resurrect
  // the overlay from stale S.panel and the app looked frozen (this was hit on
  // day one). With S.panel nulled and the DOM node gone up front, any render
  // that lands afterward is a no-op, whatever order the events arrive in.
  if (!S.panel) return;
  S.panel = null;
  const o = document.getElementById('overlay');
  if (o) o.remove();
  restorePanelFocus();
  // Then consume the history entry the panel pushed, so Back stays correct.
  if (history.state && history.state.panel) history.back();
  setTimeout(processCelebQueue, 350); // popups held back while a panel was open
}

function renderPanel() {
  const old = document.getElementById('overlay');
  if (old) old.remove();
  if (!S.panel) { if (old) restorePanelFocus(); return; }
  // Fresh open (not a re-render of a panel already up): remember the opener.
  if (!old && !panelOpener) { panelOpener = document.activeElement; panelOpenerKey = focusKey(panelOpener); }
  const wrap = document.createElement('div');
  wrap.className = 'overlay'; wrap.id = 'overlay';
  const p = S.panel;
  if (p.type === 'item') wrap.innerHTML = `<div class="panelbox" role="dialog" aria-modal="true">${itemFormHTML(p.id ? itemById(p.id) : null)}</div>`;
  else if (p.type === 'video') wrap.innerHTML = `<div class="panelbox" role="dialog" aria-modal="true">${videoFormHTML(p.id ? (S.videos || []).find(v => v.id === p.id) : null, p.fromItem)}</div>`;
  else if (p.type === 'deal') wrap.innerHTML = `<div class="panelbox" role="dialog" aria-modal="true">${dealFormHTML(p.id ? (S.deals || []).find(d => d.id === p.id) : null)}</div>`;
  else if (p.type === 'coupon') wrap.innerHTML = `<div class="panelbox" role="dialog" aria-modal="true">${couponFormHTML(p.id ? (S.coupons || []).find(c => c.id === p.id) : null)}</div>`;
  else if (p.type === 'badges') wrap.innerHTML = `<div class="panelbox" role="dialog" aria-modal="true">${badgesHTML()}</div>`;
  else if (p.type === 'month') {
    const row = p.id ? (S.income || []).find(m => m.id === p.id) : null;
    wrap.innerHTML = `<div class="panelbox" role="dialog" aria-modal="true">${monthFormHTML(row)}</div>`;
  }
  else if (p.type === 'brandEmail') {
    const deal = (S.deals || []).find(d => d.id === p.dealId);
    if (!deal) return;
    wrap.innerHTML = `<div class="panelbox" role="dialog" aria-modal="true">${brandEmailHTML(deal)}</div>`;
  }
  else if (p.type === 'linkedPrompt') wrap.innerHTML = `<div class="panelbox" role="dialog" aria-modal="true">${linkedPromptHTML(p)}</div>`;
  else if (p.type === 'upgrade') wrap.innerHTML = `<div class="panelbox" role="dialog" aria-modal="true">${upgradeHTML(p)}</div>`;
  else if (p.type === 'help') wrap.innerHTML = `<div class="panelbox" role="dialog" aria-modal="true">${helpHTML()}</div>`;
  else if (p.type === 'paceGoal') wrap.innerHTML = `<div class="panelbox" role="dialog" aria-modal="true" aria-labelledby="pg-title">${paceGoalHTML()}</div>`;
  else if (p.type === 'import') {
    // Dead wizard entry (import finished or page reloaded): consume it so Back
    // keeps walking toward Settings instead of parking on an empty overlay.
    if (!S.imp) { S.panel = null; history.back(); return; }
    const st = p.step || 1;
    if (S.imp.depthByStep[st] !== undefined) S.imp.depth = S.imp.depthByStep[st];
    wrap.innerHTML = `<div class="panelbox" role="dialog" aria-modal="true">${importWizardHTML(st)}</div>`;
  }
  else return;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', e => { if (e.target === wrap) closePanel(); });
  document.onkeydown = e => { if (e.key === 'Escape' && S.panel) closePanel(); };
  trapFocus(wrap);
  const first = wrap.querySelector('input,select,textarea,button');
  if (first) first.focus();
  wirePanel(p);
}

// Prefilled brand email. Opens in the USER'S mail app (mailto:) so it sends
// from their own address — Porch Pile never sends mail to third parties.
function brandEmailDraft(d) {
  const items = (d.item_ids || []).map(itemById).filter(Boolean);
  const vids = (S.videos || []).filter(v => v.status === 'posted' && (v.item_ids || []).some(id => (d.item_ids || []).includes(id)));
  const links = [...new Set(vids.flatMap(v => v.urls || []))];
  const coupon = (S.coupons || []).find(c => c.deal_id === d.id && !c.used);
  const names = items.map(i => i.name);
  const nameList = names.length === 0 ? 'your product'
    : names.length === 1 ? names[0]
    : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  const subject = `Your ${d.brand} video is live!`;
  const body = `Hi ${d.contact_name || 'there'},\n\n` +
    `Good news! The video featuring ${nameList} is live. Here's where to watch:\n\n` +
    (links.length ? links.join('\n') : '[paste your video link here]') + '\n\n' +
    (coupon ? `The ${coupon.code} code is included too.\n\n` : '') +
    `Thanks so much for working together on this. Let me know if there's anything else you need!`;
  return { subject, body, missingLinks: !links.length };
}

async function copyText(text, fallbackEl) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* fall through to the selection route */ }
  try {
    fallbackEl.focus(); fallbackEl.select();
    return document.execCommand('copy');
  } catch (e) { return false; }
}

      $('be-emailonly').hidden = m !== 'email';

    $('be-copy').onclick = async () => {
      if ($('be-copy').busy) return;
      $('be-copy').busy = true;
      try {
      const body = $('be-body');
      const ok = await copyText(body.value, body);

      await markSent();

      } finally { $('be-copy').busy = false; }
    };
    $('be-open').onclick = async () => {
      if ($('be-open').busy) return;

// Video hit Posted: medium celebration, then ask about product-page links.
function celebratePosted(advancedItemIds) {
  banditSay("POSTED. That's what I'm talking about.");
  banditState('state-celebrating', 1800);
  burst(innerWidth / 2, innerHeight / 3, 16);
  setTimeout(() => burst(innerWidth / 3, innerHeight / 2, 12), 250);
  if (advancedItemIds && advancedItemIds.length) {
    openPanel({ type: 'linkedPrompt', itemIds: advancedItemIds });
  } else {
    toast('Video posted!');
  }
}

// Brand deal hits Paid: the big one for a creator — medium celebration now,
// the bigger celebration lives in the badges code.
function celebratePaid(brand) {
  banditSay(`${brand} PAID. That's real money for real work.`);
  banditState('state-celebrating', 2000);
  burst(innerWidth / 2, innerHeight / 3, 18);
  setTimeout(() => burst(innerWidth / 3, innerHeight / 2, 14), 250);
  setTimeout(() => burst(innerWidth * 2 / 3, innerHeight / 2, 14), 500);
  toast('Deal PAID.');
}

async function advanceDeal(...a) {
  if (advanceDeal.busy) return;
  advanceDeal.busy = true;
  try { return await advanceDealRun(...a); } finally { advanceDeal.busy = false; }
}
async function advanceDealRun(id, ev) {
  const d = (S.deals || []).find(x => x.id === id);
  const next = d && DEAL_NEXT[d.status];
  if (!next) return;
  const btn = ev && ev.target && ev.target.closest ? ev.target.closest('button') : null;
  if (btn) btn.disabled = true;
  const r = await app.call(`/api/deals/${id}`, { method: 'PUT', body: { status: next, expected_status: d.status } });
  if (!r.ok) return toast(r.data.error || 'Could not advance.');
  if (r.data.stale) { await refresh(); return; }
  if (ev && ev.target) {
    const rect = ev.target.getBoundingClientRect();
    burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 10);
  }
  await refresh();
  if (next === 'paid') celebratePaid(d.brand);
  else { toast(`${d.brand} → ${STATUS_LABEL[next]}.`); banditState('state-pleased', 800); }
}

async function quickAddDeal(...a) {
  if (quickAddDeal.busy) return;
  quickAddDeal.busy = true;
  const btn = document.querySelector('#tabbody [data-act="qadeal"]');
  if (btn) btn.disabled = true;
  try { return await quickAddDealRun(...a); }
  finally { quickAddDeal.busy = false; if (btn) btn.disabled = false; }
}
async function quickAddDealRun() {
  const brand = document.getElementById('qa-brand').value.trim();
  const channel = document.getElementById('qa-channel').value;
  const notes = document.getElementById('qa-note').value.trim();
  if (!brand) return toast('Type the brand name first.');
  const r = await app.call('/api/deals', { method: 'POST', body: {
    brand, channel, notes: notes || null,
    next_follow_up: dateAdd(tzToday(), 3), // default nudge; editable in the panel
  } });
  if (!r.ok) return toast(r.data.error || 'Could not add.');
  draftClear('qa-brand', 'qa-note');
  await refresh();
  toast(`${brand} logged, follow-up in 3 days.`);
  banditState('state-pleased', 900);
}

async function toggleCouponUsed(id) {
  const c = (S.coupons || []).find(x => x.id === id);
  if (!c) return;
  const r = await app.call(`/api/coupons/${id}`, { method: 'PUT', body: { used: !c.used } });
  if (!r.ok) return toast(r.data.error || 'Could not update.');
  await refresh();
  toast(c.used ? 'Marked unused.' : 'Marked used.');
}

// -------- module actions (event delegation on the tab body) --------
async function advanceItem(...a) {
  if (advanceItem.busy) return;
  advanceItem.busy = true;
  try { return await advanceItemRun(...a); } finally { advanceItem.busy = false; }
}
async function advanceItemRun(id, ev) {
  const it = itemById(id);
  const next = it && ITEM_NEXT[it.status];
  if (!next) return;
  const body = { status: next, expected_status: it.status };
  // The box just landed — stamp today (user tz) unless she already set a date.
  if (next === 'received' && !it.date_received) body.date_received = tzToday();
  const btn = ev && ev.target && ev.target.closest ? ev.target.closest('button') : null;
  if (btn) btn.disabled = true;
  const r = await app.call(`/api/items/${id}`, { method: 'PUT', body });
  if (!r.ok) return toast(r.data.error || 'Could not advance.');
  if (r.data.stale) { await refresh(); return; } // row moved on — just re-sync
  if (ev && ev.target) {
    const rect = ev.target.getBoundingClientRect();
    burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 10);
  }
  await refresh();
  if (next === 'linked') { toast(`${it.name} is Linked. Full loop.`); banditState('state-celebrating', 1400); }
  else { toast(`${it.name} → ${STATUS_LABEL[next]}.`); banditState('state-pleased', 800); }
}

async function advanceVideo(...a) {
  if (advanceVideo.busy) return;
  advanceVideo.busy = true;
  try { return await advanceVideoRun(...a); } finally { advanceVideo.busy = false; }
}
async function advanceVideoRun(id, ev) {
  const v = (S.videos || []).find(x => x.id === id);
  const next = v && VIDEO_NEXT[v.status];
  if (!next) return;
  const btn = ev && ev.target && ev.target.closest ? ev.target.closest('button') : null;
  if (btn) btn.disabled = true;
  const r = await app.call(`/api/videos/${id}`, { method: 'PUT', body: { status: next, expected_status: v.status } });
  if (!r.ok) return toast(r.data.error || 'Could not advance.');
  if (r.data.stale) { await refresh(); return; } // row moved on — just re-sync
  if (ev && ev.target) {
    const rect = ev.target.getBoundingClientRect();
    burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 10);
  }
  await refresh();
  if (next === 'posted') celebratePosted(r.data.advanced_to_posted || []);
  else { toast(`${v.title} → ${STATUS_LABEL[next]}.`); banditState('state-pleased', 800); }
}

function wireModuleActions(b) {
  b.onclick = e => {
    const t = e.target;
    const actEl = t.closest('[data-act]');
    if (actEl) {
      const act = actEl.dataset.act;
      if (act === 'additem') return openPanel({ type: 'item' });
      if (act === 'addvideo') return openPanel({ type: 'video' });
      if (act === 'addcoupon') return openPanel({ type: 'coupon' });
      if (act === 'adddeal') return openPanel({ type: 'deal' });
      if (act === 'addmonth') return openPanel({ type: 'month' });
      if (act === 'gopro') return openPanel({ type: 'upgrade', cap: 'income' });
      if (act === 'gopro-import') return openPanel({ type: 'upgrade' });
      if (act === 'import-start') return openImport();
      if (act === 'import-undo') return undoRecentImport(actEl.dataset.batch);
      if (act === 'goincome') return go({ view: 'app', tab: 'income' });
      if (act === 'badges') return openPanel({ type: 'badges' });
      if (act === 'qadeal') return quickAddDeal();
      if (act === 'goqueue') return go({ view: 'app', tab: 'pile', sub: 'queue' });
      if (act === 'godeals') return go({ view: 'app', tab: 'deals' });
      if (act === 'gopile') return go({ view: 'app', tab: 'pile' });
      if (act === 'gosettings') return go({ view: 'app', tab: 'settings' });
      if (act === 'pilelist') { if (S.sub) go({ view: 'app', tab: 'pile' }); return; }
      if (act === 'pilequeue') { if (S.sub !== 'queue') go({ view: 'app', tab: 'pile', sub: 'queue' }); return; }
    }
    const adv = t.closest('[data-adv]');
    if (adv) { e.stopPropagation(); return advanceItem(adv.dataset.adv, e); }
    const film = t.closest('[data-film]');
    if (film) { e.stopPropagation(); return openPanel({ type: 'video', fromItem: film.dataset.film }); }
    const vadv = t.closest('[data-vadv]');
    if (vadv) { e.stopPropagation(); return advanceVideo(vadv.dataset.vadv, e); }
    const dadv = t.closest('[data-dadv]');
    if (dadv) { e.stopPropagation(); return advanceDeal(dadv.dataset.dadv, e); }
    const used = t.closest('[data-used]');
    if (used) { e.stopPropagation(); return toggleCouponUsed(used.dataset.used); }
    const mailB = t.closest('[data-mail]');
    if (mailB) { e.stopPropagation(); return openPanel({ type: 'brandEmail', dealId: mailB.dataset.mail }); }
    const icard = t.closest('[data-item]');
    if (icard) return openPanel({ type: 'item', id: icard.dataset.item });
    const vcard = t.closest('[data-video]');
    if (vcard) return openPanel({ type: 'video', id: vcard.dataset.video });
    const dcard = t.closest('[data-deal]');
    if (dcard) return openPanel({ type: 'deal', id: dcard.dataset.deal });
    const ccard = t.closest('[data-coupon]');
    if (ccard) return openPanel({ type: 'coupon', id: ccard.dataset.coupon });
    const mcard = t.closest('[data-inc]');
    if (mcard) return openPanel({ type: 'month', id: mcard.dataset.inc });
  };
  // chart tooltips (bar segments + donut slices)
  b.onmousemove = e => {
    const seg = e.target.closest && e.target.closest('[data-tip]');
    let tip = document.getElementById('tip');
    if (!seg) { if (tip) tip.remove(); return; }
    if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; tip.id = 'tip'; document.body.appendChild(tip); }
    tip.textContent = seg.getAttribute('data-tip');
    const pad = 14;
    tip.style.left = Math.min(e.clientX + pad, innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = (e.clientY - tip.offsetHeight - pad < 8 ? e.clientY + pad : e.clientY - tip.offsetHeight - pad) + 'px';
  };
  b.onmouseleave = () => { const tip = document.getElementById('tip'); if (tip) tip.remove(); };
  b.onchange = e => {
    const f = e.target.closest('[data-filter]');
    if (f) { S.pileFilters[f.dataset.filter] = f.value; renderTab(); }
  };
  b.querySelectorAll('[data-fstatus]').forEach(p => p.addEventListener('click', () => {
    S.pileFilters.status = p.dataset.fstatus; renderTab();
  }));
  // Keyboard access for card "buttons"
  b.onkeydown = e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (e.target.id === 'qa-brand' || e.target.id === 'qa-note') {
      if (e.key === 'Enter') { e.preventDefault(); quickAddDeal(); }
      return;
    }
    const card = e.target.closest('[data-item],[data-video],[data-deal],[data-coupon]');
    if (!card || e.target.closest('button')) return;
    e.preventDefault();
    if (card.dataset.item) openPanel({ type: 'item', id: card.dataset.item });
    else if (card.dataset.video) openPanel({ type: 'video', id: card.dataset.video });
    else if (card.dataset.deal) openPanel({ type: 'deal', id: card.dataset.deal });
    else openPanel({ type: 'coupon', id: card.dataset.coupon });
  };
}

function wireTab() {
  const body = document.getElementById('tabbody');
  if (body) wireModuleActions(body);
  // Both Save buttons send both fields (the timezone box stays in the DOM while
  // Advanced is folded), so neither one can wipe the other's unsaved edit.
  // Errors show under the button that was pressed.
  const wireSave = (btnId, msgId) => {
    const save = document.getElementById(btnId);
    if (!save) return;
    save.onclick = async () => {
      if (save.busy) return;
      save.busy = true; save.disabled = true;
      const m = document.getElementById(msgId);
      if (m) { m.className = 'msg'; m.textContent = ''; }
      try {
      const pace_goal = Number(document.getElementById('set-pace').value);
      const tz = document.getElementById('set-tz').value.trim();
      const r = await app.call('/api/settings', { method: 'PUT', body: { pace_goal, tz } });
      if (!r.ok) { if (m) { m.className = 'msg err'; m.textContent = r.data.error || 'Could not save.'; } return; }
      S.user = r.data.user;
      draftClear('set-pace', 'set-tz');
      toast('Settings saved.');
      banditState('state-pleased', 900);
      } finally { save.busy = false; save.disabled = false; }
    };
  };
  wireSave('save-set', 'msg');
  wireSave('save-tz', 'msg-tz');
  // Advanced fold: opening it is one history entry (Back folds it again),
  // closing it by hand consumes that entry so Back never needs a dead press.
  const adv = document.getElementById('adv-settings');
  if (adv) adv.addEventListener('toggle', () => {
    if (adv.open && !S.adv) {
      S.adv = true;
      nav({ view: 'app', tab: S.tab, sub: S.sub, adv: true });
    } else if (!adv.open && S.adv) {
      S.adv = false;
      if (history.state && history.state.adv && !history.state.panel) history.back();
    }
  });
  wirePricing(body); // free-tier Pro card on the Settings tab
  if (S.tab === 'settings' && (S.user.pro || !S.billing)) loadRecentImport();
  const portal = document.getElementById('pp-portal');
  if (portal) portal.onclick = async () => {
    portal.disabled = true;
    const r = await app.call('/api/stripe/portal', { method: 'POST' });
    portal.disabled = false;
    if (r.ok && r.data.url) location.href = r.data.url;
    else toast(r.data.error || 'Could not open the billing portal.');
  };
  const out = document.getElementById('out');
  if (out) out.onclick = async () => {
    await app.call('/api/auth/logout', { method: 'POST' });
    // The app view is now stale (session gone) — replace so Back can't return to
    // it, and clear authed + cached data so Back into an OLDER app entry still
    // beneath this one renders login, not stale UI.
    clearSessionState();
    go({ view: 'login' }, { replace: true });
  };
  const exp = document.getElementById('exp');
  if (exp) exp.onclick = async () => {
    const r = await fetch('/api/account/export', { credentials: 'include' });
    if (r.status === 401) return sessionEnded();
    if (!r.ok) return toast('Could not export right now. Try again in a minute.');
    const blob = await r.blob();
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'porch-pile-export.json'; a.click();
  };
  const del = document.getElementById('del');
  if (del) del.onclick = async () => {
    const password = prompt("This permanently deletes your account and everything you added to the app. Payment records we keep for taxes stay, as the Privacy Policy explains. Enter your password to confirm:");
    if (!password) return;
    const r = await app.call('/api/me', { method: 'DELETE', body: { password } });
    if (r.ok) { clearSessionState(); go({ view: 'login' }, { replace: true }); }
    else msg('err', r.data.error || 'Could not delete account.');
  };
}

// -------- back-button history wiring --------
// restoringHistory: true while a popstate-triggered render runs, so render
// functions' own nav() calls don't re-push.
let restoringHistory = false;
let historyStarted = false; // false until the first view has claimed history.state
// authed: whether THIS tab currently has a live session — not a security
// boundary (the server checks the cookie on every call), just what renderView
// is allowed to paint after Back/Forward into a stale app entry.
let authed = false;
function clearSessionState() {
  draftClear();
  authed = false;
  S.user = null;
  S.items = null; S.videos = null; S.deals = null; S.coupons = null; S.income = null;
  S.unlocked = null; S.rankIdx = undefined;
  celebQueue.length = 0;
  S.tab = 'today'; S.sub = null; S.panel = null; S.adv = false;
}
function statesEqual(a, b) { return JSON.stringify(a || null) === JSON.stringify(b || null); }
function nav(state, { replace = false, url } = {}) {
  if (restoringHistory) return;
  if (!replace && statesEqual(history.state, state)) return; // already here — no duplicate entry
  if (!historyStarted || replace) { history.replaceState(state, '', url); historyStarted = true; }
  else history.pushState(state, '', url);
}
function go(state, opts) { nav(state, opts); renderView(state); }
function renderView(state) {
  if (!state || !state.view) { renderLoginView(); return; }
  switch (state.view) {
    case 'signup': renderSignupView(); break;
    case 'verify': renderVerifyView(state.email); break;
    case 'forgot': renderForgotView(); break;
    case 'reset': renderResetView(state.token); break;
    case 'app':
      // No live session (e.g. Back/Forward after logout or account deletion)
      // — never repaint cached authenticated UI. Land on login instead.
      if (!authed) { renderLoginView(); break; }
      S.tab = state.tab || 'today';
      S.sub = state.sub || null;
      S.panel = state.panel || null;
      S.adv = !!state.adv;
      renderAppView();
      break;
    default: renderLoginView(); break;
  }
}
window.addEventListener('popstate', e => {
  restoringHistory = true;
  // Back out of a running tour ends it rather than replaying stops.
  if (S.tourStep !== undefined && !(e.state && e.state.tour)) endTour(true);
  renderView(e.state);
  restoringHistory = false;
  if (S.tourAfterPace && !S.panel) {
    S.tourAfterPace = false;
    if (authed) setTimeout(maybeOfferTour, 200);
  }
});

// -------- boot / routing --------
async function boot() {
  const params = new URLSearchParams(location.search);
  // Affiliate referral (?ref=CODE from /r/ links) — persist for checkout.
  const ref = (params.get('ref') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 40);
  // try/catch: a browser with storage blocked throws here, and boot must still run.
  if (ref) { try { localStorage.setItem('pp_aff_ref', ref); localStorage.setItem('pp_aff_ref_at', String(Date.now())); } catch (e) {} }
  // /reset/<token> is the emailed shape; ?reset= is the old one and still works
  // for links already in inboxes. See the worker's resetUrl for why.
  const resetPath = location.pathname.match(/^\/reset\/([a-f0-9]{64})\/?$/);
  const reset = resetPath ? resetPath[1] : params.get('reset');
  if (reset) { authed = false; return go({ view: 'reset', token: reset }); }
  const upgraded = params.get('upgraded'), canceled = params.get('canceled');
  // Strip one-shot params from the URL so refresh/Back never replays them.
  const stripUrl = (upgraded || canceled || ref) ? { url: '/app' } : undefined;
  const r = await app.call('/api/me');
  if (r.ok && r.data) S.billing = r.data.billing !== false;
  if (r.ok && r.data.user) {
    S.user = r.data.user;
    authed = true;
    if (upgraded) {
      go({ view: 'app', tab: 'settings' }, stripUrl);
      finalizeUpgrade();
      return;
    }
    if (canceled) return go({ view: 'app', tab: 'settings' }, stripUrl);
    // Back from /guide (or any page) reloads /app: reopen the tab this history
    // entry was on, not Today, so the visitor lands where they left (and their
    // typed draft has its field to come back into).
    const hs = history.state;
    const backTab = hs && hs.view === 'app' && TABS.some(([k]) => k === hs.tab) ? hs.tab : null;
    return go({ view: 'app', tab: backTab || S.tab || 'today' }, stripUrl);
  }
  authed = false;
  go({ view: 'login' }, stripUrl);
}
window.viewSignup = viewSignup; window.viewLogin = viewLogin; window.viewForgot = viewForgot;
boot();
</script>
