# Porch Pile: Cloudflare Worker + D1. See README.md for setup.
name = "porch-pile"
main = "src/worker.js"
compatibility_date = "2025-04-01"

assets = { directory = "./public", binding = "ASSETS", run_worker_first = true, not_found_handling = "404-page" }
workers_dev = true

# Using your own domain? Uncomment and change:
# routes = [ { pattern = "example.com", custom_domain = true } ]

[observability]
enabled = true

# Daily cleanup of expired rate-limit rows, codes and reset tokens.
[triggers]
crons = ["17 9 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "porch-pile"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"   # from: npx wrangler d1 create porch-pile

[vars]
APP_NAME = "Porch Pile"
APP_URL = "https://porch-pile.YOUR-SUBDOMAIN.workers.dev"
# Optional extras (leave blank to turn off):
ALERT_WEBHOOK_URL = ""
FEEDBACK_WEBHOOK = ""
SIGNUP_WEBHOOK_URL = ""
AFFILIATE_API_URL = ""
EXTRA_ORIGINS = ""
EMAIL_FROM = "Porch Pile <noreply@example.com>"

# Paid plan (optional). Create a monthly + annual price in your Stripe dashboard.
# The prices people see live in public/app.html (PRICE) and public/index.html. See README.
STRIPE_PRICE_MONTHLY = ""
STRIPE_PRICE_ANNUAL = ""
STRIPE_PORTAL_CONFIG = ""
# "true" turns on Stripe Tax at checkout. Set up Stripe Tax in your Stripe account first.
STRIPE_AUTOMATIC_TAX = "false"

# Secrets: set each with `npx wrangler secret put NAME`. See .dev.vars.example.
